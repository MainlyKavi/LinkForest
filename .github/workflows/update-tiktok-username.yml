name: Update TikTok username

on:
  push:
    paths:
      - '.github/workflows/update-tiktok-username.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace old TikTok username everywhere
        run: |
          grep -RIl --exclude-dir=.git 'mainlykaviii' . | xargs -r sed -i 's/mainlykaviii/Mainlykavi/g'

      - name: Commit updated links and remove one-time workflow
        run: |
          rm -f .github/workflows/update-tiktok-username.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Update TikTok link to @Mainlykavi'
          git push
