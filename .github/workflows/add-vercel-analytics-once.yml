name: Add Vercel Analytics once

on:
  push:
    paths:
      - '.github/workflows/add-vercel-analytics-once.yml'

permissions:
  contents: write

jobs:
  add-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Vercel Web Analytics to static pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('Socials.html'), Path('projects.html')]
          marker = '<script defer data-domain="mainlykavi.com" src="https://plausible.io/js/script.js"></script>'
          snippet = '''<!-- Vercel Web Analytics -->
          <script>
            window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
          </script>
          <script defer src="/_vercel/insights/script.js"></script>'''

          for path in files:
              raw = path.read_bytes()
              had_bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig')

              if '/_vercel/insights/script.js' in text:
                  print(f'{path}: analytics already present')
                  continue

              if marker in text:
                  text = text.replace(marker, marker + '\n\n' + snippet, 1)
              elif '</head>' in text:
                  text = text.replace('</head>', snippet + '\n</head>', 1)
              else:
                  raise RuntimeError(f'Could not find insertion point in {path}')

              out = text.encode('utf-8')
              if had_bom:
                  out = b'\xef\xbb\xbf' + out
              path.write_bytes(out)
              print(f'{path}: Vercel Analytics added')
          PY

      - name: Commit the changes and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-vercel-analytics-once.yml
          git add index.html Socials.html projects.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Vercel Web Analytics to static pages"
          git push origin HEAD:main
