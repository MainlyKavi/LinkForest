<style>
  .home{
    min-height:100vh;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }

  /* avatar: glass ring around the (very much vintage) profile picture */
  .avatar{
    position:relative;
    width:120px; height:120px;
    padding:5px;
    border-radius:50%;
    margin-bottom:18px;
  }
  .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .avatar .lore{
    position:absolute; left:50%; top:calc(100% + 6px); z-index:5;
    padding:7px 12px; border-radius:999px;
    white-space:nowrap;
    font-family:var(--font-serif); font-style:italic; font-size:16px;
    opacity:0; transform:translate(-50%, -6px) scale(.94);
    transition:opacity .2s var(--ease), transform .4s var(--spring);
    pointer-events:none;
  }
  .avatar:hover .lore{ opacity:1; transform:translate(-50%, 0) scale(1); }

  .name-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .name{
    margin:0;
    font-weight:700;
    font-size:clamp(34px, 10vw, 42px);
    line-height:1;
    letter-spacing:-.04em;
  }
  .verified{ width:27px; height:27px; flex:none; filter:drop-shadow(0 1px 3px rgba(0,0,0,.3)); }

  .tagline{
    margin:10px 0 22px;
    padding:4px 10px;
    border-radius:12px;
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-serif); font-style:italic; font-weight:400;
    font-size:clamp(19px, 5.4vw, 22px);
    line-height:1.2;
    letter-spacing:.005em;
    color:var(--text);
    text-shadow:0 1px 2px rgba(40,10,30,.45), 0 0 14px rgba(40,20,60,.35), 0 2px 22px rgba(20,30,70,.3);
    transition:color .2s var(--ease);
  }
  .tagline:hover{ color:var(--text); }
  .tagline-text{ display:inline-block; transition:opacity .22s var(--ease), filter .22s var(--ease), transform .35s var(--spring); }
  .tagline.is-swapping .tagline-text{ opacity:0; filter:blur(6px); transform:translateY(4px) scale(.98); }
  .tagline .dice{
    width:17px; height:17px; flex:none; opacity:.55;
    transition:transform .5s var(--spring), opacity .2s var(--ease);
  }
  .tagline:hover .dice, .tagline:focus-visible .dice{ opacity:.95; }
  .tagline.is-swapping .dice{ transform:rotate(200deg); }

  .rail{ display:flex; justify-content:center; gap:clamp(10px, 3.2vw, 14px); margin:0 0 30px; padding:0; list-style:none; }
  .rail a{ width:clamp(48px, 13vw, 52px); height:clamp(48px, 13vw, 52px); display:grid; place-items:center; border-radius:999px; }
  .rail svg{ width:46%; height:46%; filter:drop-shadow(0 1px 3px rgba(0,0,0,.28)); }
  .rail a.facebook svg{ width:50%; height:50%; }

  .actions{ width:100%; display:grid; gap:14px; margin:0; padding:0; list-style:none; }
  .home-btn{
    height:64px;
    display:grid; grid-template-columns:56px 1fr 56px; align-items:center;
    font-size:16.5px; font-weight:600; letter-spacing:-.015em;
  }
  .home-btn .ico{ justify-self:end; width:23px; height:23px; opacity:.95; }
  .home-btn .ico svg, .home-btn .go svg{ width:100%; height:100%; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .home-btn .go{ justify-self:start; width:18px; height:18px; opacity:.7; transition:transform .45s var(--spring), opacity .2s var(--ease); }
  .home-btn.is-lg-hovered .go, .home-btn:focus-visible .go{ transform:translateX(4px); opacity:1; }
  .home-btn[target="_blank"].is-lg-hovered .go{ transform:translate(3px, -3px); }

  .hit{
    margin-top:22px;
    height:48px; padding:0 22px 0 18px;
    display:inline-flex; align-items:center; gap:9px;
    font-size:15px; font-weight:600; letter-spacing:-.01em;
  }
  .hit svg{ width:19px; height:19px; }
  .hit .wave{ display:inline-block; transform-origin:70% 80%; }
  .hit.is-lg-hovered .wave{ animation:wave .9s var(--ease) 1; }
  @keyframes wave{ 20%{ transform:rotate(16deg); } 45%{ transform:rotate(-10deg); } 70%{ transform:rotate(10deg); } }

  @media (max-width:360px){
    .home-btn{ height:58px; font-size:15.5px; grid-template-columns:46px 1fr 46px; }

<script>
document.addEventListener('DOMContentLoaded', function(){
  var MK = window.MK || {};
  var coffee = document.getElementById('coffeeBtn');
  if (coffee && MK.coffeeUrl) coffee.href = MK.coffeeUrl;

  var lines = (MK.taglines || []).slice();
  var btn = document.getElementById('tagline');
  var text = btn && btn.querySelector('.tagline-text');
  if (!btn || lines.length < 2) return;
  var index = 0, busy = false;
  btn.addEventListener('click', function(){
    if (busy) return;
    busy = true;
    index = (index + 1) % lines.length;
    btn.classList.add('is-swapping');
    setTimeout(function(){
      text.textContent = lines[index];
      btn.classList.remove('is-swapping');
      busy = false;
    }, 220);
  });
});
</script>
