<script>
(function(){
  'use strict';

  var menuBtn=document.getElementById('menuBtn');
  var panel=document.getElementById('menuPanel');
  var scrim=document.getElementById('menuScrim');
  var closeBtn=document.getElementById('menuCloseBtn');
  var scrimTimer;
  function openMenu(){
    if(!menuBtn||!panel||!scrim||!closeBtn)return;
    clearTimeout(scrimTimer);
    panel.classList.add('open');
    scrim.hidden=false;
    requestAnimationFrame(function(){scrim.classList.add('show')});
    panel.setAttribute('aria-hidden','false');
    menuBtn.setAttribute('aria-expanded','true');
    document.body.style.overflow='hidden';
    closeBtn.focus({preventScroll:true});
  }
  function closeMenu(restore){
    if(!menuBtn||!panel||!scrim)return;
    panel.classList.remove('open');
    scrim.classList.remove('show');
    panel.setAttribute('aria-hidden','true');
    menuBtn.setAttribute('aria-expanded','false');
    document.body.style.overflow='';
    scrimTimer=setTimeout(function(){scrim.hidden=true},300);
    if(restore!==false)menuBtn.focus({preventScroll:true});
  }
  if(menuBtn&&panel&&scrim&&closeBtn){
    menuBtn.addEventListener('click',openMenu);
    closeBtn.addEventListener('click',function(){closeMenu(true)});
    scrim.addEventListener('click',function(){closeMenu(true)});
    document.addEventListener('keydown',function(event){if(event.key==='Escape'&&panel.classList.contains('open')){event.preventDefault();closeMenu(true)}});
  }

  var exploreToggle=document.getElementById('exploreToggle');
  var exploreOptions=document.getElementById('exploreOptions');
  if(exploreToggle&&exploreOptions){
    exploreToggle.addEventListener('click',function(){
      var opening=exploreToggle.getAttribute('aria-expanded')!=='true';
      exploreToggle.setAttribute('aria-expanded',String(opening));
      exploreOptions.classList.toggle('is-open',opening);
      exploreOptions.setAttribute('aria-hidden',String(!opening));
      if(opening)exploreOptions.removeAttribute('inert');
      else exploreOptions.setAttribute('inert','');
    });
  }

  var normalCopy='Either this page disappeared, never existed, or you typed something questionable.';
  var eggCopy="okay now you're just clicking things.";
  var errorCode=document.getElementById('errorCode');
  var supportLine=document.getElementById('supportLine');
  var codeClicks=0;
  if(errorCode&&supportLine){
    errorCode.addEventListener('click',function(){
      codeClicks+=1;
      if(codeClicks===4)supportLine.textContent=eggCopy;
      else if(codeClicks>=5){supportLine.textContent=normalCopy;codeClicks=0}
    });
  }

  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  var finePointer=window.matchMedia('(hover: hover) and (pointer: fine)');
  var errorStage=document.getElementById('errorStage');
  var parallaxTimer=0;
  if(errorCode&&errorStage){
    errorStage.addEventListener('pointermove',function(event){
      if(reduced.matches||!finePointer.matches)return;
      var rect=errorStage.getBoundingClientRect();
      var nx=((event.clientX-rect.left)/rect.width-.5)*2;
      var ny=((event.clientY-rect.top)/rect.height-.5)*2;
      errorCode.style.setProperty('--code-x',(nx*3.2).toFixed(2)+'px');
      errorCode.style.setProperty('--code-y',(ny*2.1).toFixed(2)+'px');
      errorCode.style.setProperty('--code-rx',(-ny*.55).toFixed(2)+'deg');
      errorCode.style.setProperty('--code-ry',(nx*.7).toFixed(2)+'deg');
      errorCode.classList.add('is-parallaxing');
      clearTimeout(parallaxTimer);
      parallaxTimer=setTimeout(function(){errorCode.classList.remove('is-parallaxing')},140);
    },{passive:true});
    errorStage.addEventListener('pointerleave',function(){
      errorCode.style.setProperty('--code-x','0px');
      errorCode.style.setProperty('--code-y','0px');
      errorCode.style.setProperty('--code-rx','0deg');
      errorCode.style.setProperty('--code-ry','0deg');
      errorCode.classList.remove('is-parallaxing');
    });
  }

  var homeButton=document.getElementById('homeButton');
  function setButtonPointer(event){
    if(!homeButton)return;
    var rect=homeButton.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    var x=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
    var y=Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
    homeButton.style.setProperty('--lg-x',(x*100).toFixed(1)+'%');
    homeButton.style.setProperty('--lg-y',(y*100).toFixed(1)+'%');
    if(homeButton.classList.contains('is-pressed')){
      homeButton.style.setProperty('--press-x',((x-.5)*2.2).toFixed(2)+'px');
      homeButton.style.setProperty('--press-y',((y-.5)*1.25).toFixed(2)+'px');
    }
  }
  function releaseHomeButton(){
    if(!homeButton)return;
    homeButton.classList.remove('is-pressed');
    homeButton.style.setProperty('--press-x','0px');
    homeButton.style.setProperty('--press-y','0px');
  }
  if(homeButton){
    homeButton.addEventListener('pointermove',setButtonPointer,{passive:true});
    homeButton.addEventListener('pointerdown',function(event){
      if(event.button!==0)return;
      setButtonPointer(event);
      homeButton.classList.add('is-pressed');
      try{homeButton.setPointerCapture(event.pointerId)}catch(e){}
    });
    homeButton.addEventListener('pointerup',releaseHomeButton);
    homeButton.addEventListener('pointercancel',releaseHomeButton);
    homeButton.addEventListener('lostpointercapture',releaseHomeButton);
    homeButton.addEventListener('pointerleave',function(){
      if(!homeButton.classList.contains('is-pressed')){
        homeButton.style.setProperty('--lg-x','50%');
        homeButton.style.setProperty('--lg-y','36%');
      }
    });
  }

  var year=document.getElementById('copyrightYear');
  if(year)year.textContent=new Date().getFullYear();
})();
</script>
