<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Glass lab: upgraded engine</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/liquid-glass-buttons.css">
<style>
  :root{ --ease:cubic-bezier(.22,.9,.26,1); }
  html,body{margin:0;height:100%;font-family:Geist,system-ui,sans-serif;color:#fff}
  .bg{position:fixed;inset:0;background:url(/assets/bg-day.webp) center 18%/cover}
  .stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 20px;box-sizing:border-box}
  .label{position:fixed;top:12px;left:12px;font:600 12px Geist;background:#0008;padding:6px 10px;border-radius:8px;z-index:9}
  .lg.big{width:min(340px,86vw);height:58px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:600;font-size:15.5px;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.28),0 2px 12px rgba(0,0,0,.18)}
  .lg.small{height:44px;padding:0 22px;display:inline-flex;align-items:center;color:#fff;text-decoration:none;font-weight:600;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .lg.icon{width:54px;height:54px;display:grid;place-items:center;color:#fff}
  .row{display:flex;gap:14px}
</style>
<script defer src="/liquid-glass-optics.js"></script>
<script defer src="/liquid-glass-buttons.js"></script>
</head>
<body>
<div class="label" id="lbl">3 · Upgraded engine</div>
<div class="bg"></div>
<div class="stage">
  <a class="lg big" data-lens href="#">All my socials</a>
  <a class="lg big" data-lens href="#">My media kit</a>
  <a class="lg big" data-lens href="#">Buy me a coffee</a>
  <a class="lg small lg-sm" data-lens data-lens-dispersion="0" href="#">Hit me up</a>
  <div class="row">
    <a class="lg icon lg-sm" data-lens data-lens-dispersion="0" href="#" aria-label="YouTube"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.4s-.2-1.6-.8-2.3c-.8-.8-1.7-.8-2.1-.9C16.4 5 12 5 12 5s-4.4 0-7.1.2c-.4 0-1.3.1-2.1.9C2.2 6.8 2 8.4 2 8.4S1.8 10.3 1.8 12.1v1.7c0 1.9.2 3.7.2 3.7s.2 1.6.8 2.3c.8.9 1.9.8 2.4.9 1.7.2 7.3.2 7.3.2s4.4 0 7.1-.2c.4 0 1.3-.1 2.1-.9.6-.7.8-2.3.8-2.3s.2-1.9.2-3.7v-1.7c0-1.9-.2-3.7-.2-3.7ZM9.9 15.5V9.4l5.4 3.05-5.4 3.05Z"/></svg></a>
    <a class="lg icon lg-sm" data-lens data-lens-dispersion="0" href="#" aria-label="Instagram"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('lbl').textContent += document.documentElement.classList.contains('lg-optics') ? ' (lens on)' : ' (fallback: frost only)';
  });
</script>
</body>
</html>
